name: Release

# Auto-cut a release on every green commit to main (Test must pass first).
# The bump decision, release notes, tagging and build dispatch all live in
# Seklfreak/ai-release-action — this file supplies only what is specific to lab-tracker.
#
# project-description is what the classifier judges "can this change reach a user?"
# against, so it must describe THIS project. A description carried over from another
# repo silently suppresses real releases; that is why it has no default.
on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: write # push tag + create release
  actions: write # dispatch the build workflow

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # the bump is read from the commit range
          fetch-tags: true # the previous tag is the baseline

      - uses: Seklfreak/ai-release-action@v1
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          build-workflow: "build.yaml testflight.yaml"
          project-description: >-
            lab-tracker is a self-hosted lab-results tracker: a Go API (backend/) with an
            embedded migration set, a React frontend (frontend/), an MCP server, and an iOS app
            (ios/) shipped to TestFlight on every version tag. Changes under backend/, frontend/
            and ios/ all reach users. Only docs/, scripts/ and CI workflows live outside the
            released artifacts.
